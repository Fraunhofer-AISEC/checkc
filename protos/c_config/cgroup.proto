syntax = "proto3";

package c_config.cgroup;

message Config {
    string cgroup = 1; // cgroup name
    repeated Controller controllers = 2;
    map<string, string> interface_files = 3;
}

enum Controller {
    CONTROLLER_UNSPECIFIED = 0;
    CONTROLLER_CPU = 1;
    CONTROLLER_CPUSET = 2;
    CONTROLLER_FREEZER = 3;
    CONTROLLER_HUGETLB = 4;
    CONTROLLER_IO = 5;
    CONTROLLER_MEMORY = 6;
    CONTROLLER_PERF_EVENT = 7;
    CONTROLLER_PIDS = 8;
    CONTROLLER_RDMA = 9;
    CONTROLLER_MISC = 10;
}

