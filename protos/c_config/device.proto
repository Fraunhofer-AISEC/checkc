syntax = "proto3";

package c_config.device;

message Config {
  // list of devices found inside container
  repeated Device dev_devices = 1;
  // list of st_dev which could be created with mknod
  repeated Device mknod_devices = 2;
}

message Device {
  string file = 1;
  Id id = 2;
  reserved 3 to 4;
  uint32 permissions = 5;
  uint32 user = 6;
  uint32 group = 7;
  bool read_access = 8;
  bool write_access = 9;
}

enum Type {
  TYPE_BLOCK = 0;
  TYPE_CHAR = 1;
  TYPE_SOCKET = 2;
  TYPE_FIFO = 3;
}

message Id {
  Type type = 1;
  uint32 major = 2;
  uint32 minor = 3;
}
