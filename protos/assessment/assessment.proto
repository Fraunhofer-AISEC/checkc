syntax = "proto3";

package assessment;

import "c_config/ns.proto";
import "c_config/cgroup.proto";
import "c_config/caps.proto";
import "evaluation/evaluation.proto";

enum Criticality {
  CRITICALITY_UNSPECIFIED = 0;
  CRITICALITY_OK = 1;
  CRITICALITY_INFO = 2;
  CRITICALITY_WARN = 3;
  CRITICALITY_ERROR = 4;
}

message AssessmentReport { 
  bool unprivileged = 1;
  
  Goal_S1_GlobalResourceModification goal_s1 = 2;
  Goal_S2_RestrictedDeviceAccess goal_s2 = 3;
  Goal_S3_NoContainerDataLeak goal_s3 = 4;
  Goal_S4_NoAvaiabilityImpact goal_s4 = 5;
}


// security goal definitions
message SecResult {
  Criticality state = 1;
  repeated string info = 2;
}

message Goal_S1_GlobalResourceModification {
  string description = 1;
  SecResult result = 2;
  evaluation.Namespaces namespace_conf = 3;
  repeated c_config.caps.Capability capabilities = 4;
  evaluation.Chroot chroot_conf = 5;
}

message Goal_S2_RestrictedDeviceAccess {
  string description = 1;
  SecResult result = 2;
}

message Goal_S3_NoContainerDataLeak {
  string description = 1;
  SecResult result = 2;
}


message Cgroups {
  repeated c_config.cgroup.Controller active = 1;
  repeated c_config.cgroup.Controller desired = 2;
}

message Goal_S4_NoAvaiabilityImpact {
  string description = 1;
  SecResult result = 2;
  bool cgroups_namespace_used = 3;
  Cgroups used_cgroup_controllers = 4;
}
