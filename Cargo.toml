[package]
name = "checkc"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
libc = "0"
nix = {version = "0", features = ["fs","hostname","dir","mount","ioctl","feature", "user"]}
serde = "1"
serde_json = "1"
clap = { version = "4", features = ["derive", "cargo"] }
prost = "0.11"
pbjson = "0"
pbjson-types = "0"
thiserror = "2"
anyhow = {version = "1", features = ["backtrace"] }
num_enum = "0"
log = "0"
walkdir = "2"
regex = "1"
env_logger = { version = "0", features = ["color"] }
tempfile = "3"
lazy_static = "1"
once_cell = "1"
termion = "2"
uuid = { version = "1", features = ["v4"] }
glob = "0.3.2"
rust_search = "2.1.0"

[build-dependencies]
prost-build = "0.11"
pbjson-build = "0.5"
walkdir = "2.3"
